name: Build Windows EXE

# Loest den Build aus:
# - bei jedem Push auf main
# - bei jedem Push eines Tags, das mit "v" beginnt (z. B. v1.0.0) -> erzeugt zusaetzlich ein GitHub Release
# - manuell ueber den "Run workflow"-Button im Actions-Tab
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: EXE mit PyInstaller bauen
        run: >
          pyinstaller --onefile --name Netzwerkplan
          --add-data "templates;templates"
          --add-data "static;static"
          app.py

      - name: Standard-config.json der Ausgabe beilegen
        shell: pwsh
        run: |
          Copy-Item -Path "config.json" -Destination "dist\config.json"
          Copy-Item -Path "README.md" -Destination "dist\README.md"

      - name: Build als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Netzwerkplan-Windows
          path: |
            dist/Netzwerkplan.exe
            dist/config.json
            dist/README.md
          if-no-files-found: error

      # Nur bei Tag-Push (z. B. v1.0.0): erstellt automatisch ein GitHub Release
      # mit der exe und config.json als Downloads.
      - name: GitHub Release erstellen (nur bei Tag-Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Netzwerkplan.exe
            dist/config.json
            dist/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
