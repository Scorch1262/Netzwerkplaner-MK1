<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netzwerkplan</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-text">NETZWERKPLAN</span>
      <span class="brand-version" title="Version der Software">v{{ version }}</span>
    </div>

    <div class="toolbar">
      <button id="modeToggle" class="btn btn-accent" title="Zwischen Bearbeitung und Nutzung wechseln">
        <span id="modeToggleLabel">BEARBEITUNGSMODUS</span>
      </button>

      <div class="divider edit-divider"></div>

      <div id="editTools" class="edit-tools">
        <div class="palette" id="palette"></div>

        <button id="btnConnectMode" class="btn" title="Verbindung zwischen zwei Elementen ziehen">
          ⤳ Verbindung
        </button>
        <label class="chk" title="Farbe fuer neue Verbindungen">
          Farbe <input type="color" id="newConnColor" value="#3ad6ff">
        </label>

        <label class="chk"><input type="checkbox" id="chkGrid" checked> Raster</label>
        <label class="chk"><input type="checkbox" id="chkSnap" checked> Einrasten</label>

        <button id="btnSave" class="btn btn-primary" title="Konfiguration speichern">
          ⭳ Speichern
        </button>
      </div>

      <div class="divider"></div>

      <div class="search-box" title="Suche nach IP, Ort, Name, Typ, Portname, Schaltflaeche (Strg+F)">
        <span class="search-icon">⌕</span>
        <input type="search" id="searchInput" placeholder="Suche: IP, Ort, Name …" autocomplete="off" spellcheck="false">
        <span id="searchCount" class="search-count"></span>
        <button type="button" id="searchClear" class="search-clear hidden" title="Suche leeren (Esc)">✕</button>
      </div>

      <div class="divider"></div>

      <div class="zoom-controls">
        <button id="btnZoomOut" class="btn btn-icon">−</button>
        <span id="zoomLabel">100%</span>
        <button id="btnZoomIn" class="btn btn-icon">+</button>
        <button id="btnZoomReset" class="btn btn-icon" title="Ansicht zuruecksetzen">⤢</button>
      </div>
    </div>
  </header>

  <div id="viewport">
    <div id="canvasWrap">
      <div id="canvas">
        <svg id="connectionLayer"></svg>
        <div id="elementLayer"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="statusText">Bereit</span>
    <span class="statusbar-right">
      <span id="ipText"></span>
      <span id="versionText" title="Version der Software">v{{ version }}</span>
    </span>
  </div>
</div>

<!-- Modal: Element bearbeiten -->
<div id="elementModal" class="modal-overlay hidden">
  <div class="modal modal-wide">
    <h2 id="elementModalTitle">Element bearbeiten</h2>

    <label>Name
      <input type="text" id="fName" placeholder="z. B. Core-Switch">
    </label>

    <label>Ort / Standort
      <input type="text" id="fLocation" placeholder="z. B. Serverraum EG, Rack 1">
    </label>

    <label>Typ
      <select id="fType"></select>
    </label>

    <label id="fPortsRow" class="hidden-field">Anzahl Ports (je ein Andockpunkt fuer eine Verbindung)
      <input type="number" id="fPorts" min="1" max="48" step="1">
    </label>

    <div id="fPortNamesRow" class="hidden-field">
      <label>Portnamen (optional, zusaetzlich zur Portnummer)</label>
      <div id="fPortNamesList" class="port-names-list"></div>
    </div>

    <div>
      <label>Verknuepfte Webseiten / Verbindungen (je eine eigene, benennbare
        Schaltflaeche am Element – rdp:// laedt eine Remotedesktop-Datei
        herunter, vnc:// / ssh:// oeffnen ueber einen installierten Client,
        „MQTT" versendet beim Klick eine MQTT-Nachricht ueber den Server)</label>
      <div id="fLinksList" class="links-edit-list"></div>
      <button type="button" id="fAddLink" class="btn" style="margin-top:8px;">+ Webseite hinzufuegen</button>
    </div>

    <div class="modal-actions">
      <button id="fDelete" class="btn btn-danger">Loeschen</button>
      <div class="spacer"></div>
      <button id="fCancel" class="btn">Abbrechen</button>
      <button id="fSave" class="btn btn-primary">Uebernehmen</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
